<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>INKFIST 墨拳 · character viewer (dev)</title>
    <style>
      :root { --paper: #e8dcc4; --paper-light: #efe6d2; --ink: #1b1a17; --crimson: #a3262a; }
      html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
        font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
        background: rgba(239, 230, 210, 0.92); border: 1.5px solid var(--ink); border-radius: 10px; padding: 8px 10px;
        max-width: calc(100% - 48px); }
      #ui.hidden { display: none; }
      #ui b { color: var(--crimson); }
      select, input, button { font: inherit; }
      button { border: 1.5px solid var(--ink); border-radius: 999px; background: var(--paper-light); padding: 2px 10px;
        cursor: pointer; }
      button.on { background: var(--ink); color: var(--paper-light); }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
