<body>
  <div id="app">
    <canvas id="game"></canvas>
    <div id="hud" class="hidden"></div>
    <div id="cutin" class="hidden"></div>
    <div id="touch" class="hidden"></div>
    <div class="rotate armed">Turn your device sideways to fight 🔄<br><small style="font-weight:400">INKFIST plays in landscape.</small></div>
    <div id="ui">
      <section id="loading" class="screen show">
        <div class="load-wrap">
          <div class="logo"><span class="logo-en">INKFIST</span><span class="logo-han">墨拳</span></div>
          <div class="logo-sub">MURIM DUELS</div>
          <div class="load-bar"><i id="load-fill"></i></div>
          <div id="load-label" class="load-label">Grinding ink…</div>
          <div id="load-tip" class="load-tip">Deflect beats Focus. Read the red glow.</div>
        </div>
        <a id="load-sponsor" class="sponsor" target="_blank" rel="noopener"></a>
      </section>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
